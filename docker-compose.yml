# One-command bring-up: docker compose up -d --build   (see docs/deploy.md)

# Every service: restart unless deliberately stopped, and rotate container
# logs (json-file, 5 x 10 MB) so they can't fill the disk.
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *defaults
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: ${PGUSER:-tickwatch}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:-tickwatch}
    ports:
      # Localhost only: for psql, replay and benchmarks from the host.
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumer:
    <<: *defaults
    build: .
    image: tickwatch:latest
    env_file: .env
    environment:
      # Overrides for inside the compose network.
      PGHOST: db
      PGPORT: "5432"
      METRICS_ADDR: 0.0.0.0
      RAW_DIR: /data/raw
    volumes:
      - rawdata:/data/raw
    depends_on:
      db:
        condition: service_healthy
    # SIGTERM -> drain queue, flush archive (~2 s close timeout + flush).
    stop_grace_period: 20s
    healthcheck:
      # Healthy iff a frame arrived in the last 60 s (tickwatch/healthcheck.py).
      test: ["CMD", "python", "-m", "tickwatch.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    <<: *defaults
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tickwatch.json
      # Read by the provisioned TimescaleDB datasource.
      PGDATABASE: ${PGDATABASE:-tickwatch}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - db

volumes:
  pgdata:
  rawdata:
  promdata:
  grafanadata:
